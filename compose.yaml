services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigi-backend
    ports:
      - "8000:8000"
    volumes:
      - ./database:/var/www/html/database
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sigi-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
